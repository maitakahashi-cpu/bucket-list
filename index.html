<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8E1A3A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BUCKET LIST">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>やりたいことリスト</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
  /* Layout: 縞模様の台紙に、えんじ色の紙とクリップ留めのメモ。下に方眼ノートのカードとちぎれ紙のフォーム */
  :root {
    --bg: #F4EEDD;
    --stripe: #C3D0E0;
    --paper: #FCF8EC;
    --ink: #33121D;
    --muted: #7B5560;
    --wine: #8E1A3A;
    --wine-ink: #FFFFFF;
    --title: #8E1A3A;
    --sky: #A9BBD2;
    --sky-ink: #2B1420;
    --sky-soft: #D9E2EE;
    --edge: #C48A99;
    --grid: rgba(95, 120, 160, .16);
    --tape: rgba(169, 187, 210, .8);
    --clip: #2B1A20;
    --focus: #8E1A3A;
    --font-display: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    --font-body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #240E16; --stripe: #32161F; --paper: #3A1B25; --ink: #F7EAE4; --muted: #CFAFB8;
      --wine: #B8294E; --wine-ink: #FFFFFF; --title: #F0A3B5; --sky: #5B7295; --sky-ink: #FFFFFF;
      --sky-soft: #2B3A52; --edge: #8A4A5C; --grid: rgba(255, 255, 255, .06);
      --tape: rgba(107, 130, 163, .6); --clip: #0F0509; --focus: #F0A3B5;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #240E16; --stripe: #32161F; --paper: #3A1B25; --ink: #F7EAE4; --muted: #CFAFB8;
    --wine: #B8294E; --wine-ink: #FFFFFF; --title: #F0A3B5; --sky: #5B7295; --sky-ink: #FFFFFF;
    --sky-soft: #2B3A52; --edge: #8A4A5C; --grid: rgba(255, 255, 255, .06);
    --tape: rgba(107, 130, 163, .6); --clip: #0F0509; --focus: #F0A3B5;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.7;
    padding-block: 28px 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 600px; margin: 0 auto; display: grid; gap: 28px; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  /* ---------- 台紙とメモ ---------- */
  .hero {
    background: repeating-linear-gradient(90deg, var(--bg) 0 26px, var(--stripe) 26px 52px);
    border-radius: 22px;
    padding: 34px 16px 20px;
    display: grid;
    gap: 22px;
  }
  .note-wrap { position: relative; padding: 4px 8px 14px; }
  .note-wrap::before {
    content: ""; position: absolute; inset: 14px 16px 0 2px;
    background: var(--wine); transform: rotate(-3deg); border-radius: 4px;
  }
  .note {
    position: relative; background: var(--paper);
    padding: 28px 22px 34px; transform: rotate(1.2deg);
    clip-path: polygon(0 0, 100% 0, 100% 95%, 95% 98%, 89% 94%, 83% 99%, 76% 95%, 70% 98%, 63% 94%, 56% 99%, 49% 95%, 42% 98%, 35% 94%, 28% 99%, 21% 95%, 14% 98%, 7% 94%, 0 98%);
  }
  h1 {
    font-family: var(--font-display); font-weight: 900; color: var(--title);
    font-size: clamp(30px, 9vw, 44px); line-height: 1.2; letter-spacing: .04em;
    margin: 0 0 10px; text-wrap: balance;
  }
  .lead { margin: 0; color: var(--muted); font-size: 14px; }

  .status { display: flex; align-items: center; gap: 14px; }
  .badge {
    flex: none; width: 88px; height: 88px; border-radius: 50%;
    background: var(--sky); color: var(--sky-ink);
    display: grid; place-content: center; text-align: center; line-height: 1.2;
    transform: rotate(-8deg); outline: 2px dashed var(--paper); outline-offset: -6px;
  }
  .badge b { font-weight: 900; font-size: 22px; font-variant-numeric: tabular-nums; }
  .badge small { font-size: 12px; font-weight: 700; }
  .bar-card { flex: 1; min-width: 0; background: var(--paper); border-radius: 16px; padding: 12px 16px; display: grid; gap: 6px; }
  .bar-meta { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { height: 14px; border-radius: 99px; background: var(--sky-soft); border: 1.5px solid var(--wine); overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--wine); transition: width .35s ease; }

  /* ---------- 切り替え ---------- */
  .seg { display: flex; flex-wrap: wrap; gap: 8px; }
  .seg button {
    font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
    border: 1.5px solid var(--wine); background: transparent; color: var(--title);
    padding: 6px 18px; border-radius: 99px;
  }
  .seg button[aria-pressed="true"] { background: var(--wine); color: var(--wine-ink); }

  /* ---------- カテゴリのカード ---------- */
  .groups { display: grid; gap: 30px; }
  .group {
    position: relative; display: grid; gap: 12px; padding: 18px 14px 14px;
    background-color: var(--paper);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    border: 1.5px solid var(--edge); border-radius: 18px;
  }
  .group::after {
    content: ""; position: absolute; top: -10px; right: 26px; width: 60px; height: 20px;
    background: var(--tape); transform: rotate(4deg);
  }
  .group-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .group-head h2 {
    font-family: var(--font-display); font-weight: 900; font-size: 16px; letter-spacing: .06em; margin: 0;
    padding: 4px 18px; border-radius: 99px; background: var(--wine); color: var(--wine-ink);
  }
  .group.alt .group-head h2 { background: var(--sky); color: var(--sky-ink); }
  .count { font-size: 13px; font-weight: 700; color: var(--muted); background: var(--paper); padding: 0 12px; border-radius: 99px; font-variant-numeric: tabular-nums; }

  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li { display: flex; align-items: center; background: var(--paper); border: 1.5px solid var(--edge); border-radius: 14px; }
  li.done { background: var(--sky-soft); }
  li label { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 10px 4px 10px 12px; cursor: pointer; }
  .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
  li.done .txt { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
  .when {
    flex: none; font-size: 12px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums;
    background: var(--sky); color: var(--sky-ink); padding: 1px 10px; border-radius: 99px; transform: rotate(-3deg);
  }

  input[type="checkbox"] {
    appearance: none; -webkit-appearance: none; flex: none;
    width: 26px; height: 26px; margin: 0; border-radius: 50%;
    border: 2px solid var(--wine); background: var(--paper); position: relative; cursor: pointer;
  }
  input[type="checkbox"]:checked { background: var(--wine); }
  input[type="checkbox"]:checked::after {
    content: ""; position: absolute; left: 7px; top: 3px; width: 6px; height: 11px;
    border: solid var(--wine-ink); border-width: 0 2.5px 2.5px 0; transform: rotate(40deg);
  }

  .del {
    flex: none; width: 38px; height: 38px; margin-right: 6px; border: 0; background: transparent;
    color: var(--muted); font-size: 20px; line-height: 1; border-radius: 50%; cursor: pointer;
  }
  .del:hover { background: var(--sky-soft); color: var(--ink); }

  .empty { text-align: center; color: var(--muted); padding: 28px 16px; background: var(--paper); border: 1.5px dashed var(--edge); border-radius: 18px; }

  /* ---------- ちぎれ紙のフォーム ---------- */
  .join {
    display: grid; gap: 12px; background: var(--wine); color: var(--wine-ink);
    padding: 56px 18px 28px; margin-top: 4px;
    clip-path: polygon(0 14px, 4% 5px, 9% 15px, 15% 3px, 22% 13px, 28% 6px, 35% 15px, 42% 4px, 50% 14px, 57% 3px, 64% 13px, 71% 6px, 78% 15px, 86% 4px, 93% 13px, 100% 7px, 100% 100%, 0 100%);
  }
  .join:focus-within, .join :focus-visible { outline-color: var(--sky); }
  .join h2 { font-family: var(--font-display); font-weight: 900; font-size: 22px; letter-spacing: .06em; margin: 0; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  input[type="text"], input[type="email"], input[type="password"], select {
    font: inherit; color: var(--ink); background: var(--paper); border: 0;
    border-radius: 99px; padding: 11px 18px; min-width: 0;
  }
  input::placeholder { color: var(--muted); }
  input[type="text"] { flex: 1 1 220px; }
  select { flex: 0 1 auto; }
  .add {
    font: inherit; font-weight: 900; letter-spacing: .1em; border: 0; cursor: pointer;
    background: var(--sky); color: var(--sky-ink); padding: 11px 26px; border-radius: 99px;
  }
  .add:hover { filter: brightness(1.06); }

  /* ---------- 同期パネル ---------- */
  .sync { display: grid; gap: 12px; background: var(--paper); border: 1.5px dashed var(--edge); border-radius: 18px; padding: 18px 16px; }
  .sync h2 { font-family: var(--font-display); font-weight: 900; font-size: 16px; letter-spacing: .06em; margin: 0; color: var(--title); }
  .sync p { margin: 0; font-size: 13px; color: var(--muted); }
  .sync input { width: 100%; background: var(--bg); border: 1.5px solid var(--edge); }
  .auth { display: grid; gap: 10px; }
  .authed { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
  .authed span { font-size: 14px; font-weight: 700; overflow-wrap: anywhere; min-width: 0; }
  .btn { font: inherit; font-weight: 900; letter-spacing: .06em; border-radius: 99px; padding: 9px 22px; cursor: pointer; }
  .btn-wine { background: var(--wine); color: var(--wine-ink); border: 1.5px solid var(--wine); }
  .btn-line { background: transparent; color: var(--title); border: 1.5px solid var(--wine); }
  .link { background: none; border: 0; padding: 0; font: inherit; font-size: 13px; color: var(--muted); text-decoration: underline; cursor: pointer; justify-self: start; }

  footer { font-size: 12px; color: var(--muted); display: grid; gap: 4px; }

  @media (prefers-reduced-motion: reduce) { .bar > span { transition: none; } }

  html { color-scheme: light; }
  html, body { margin: 0; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  [hidden] { display: none !important; }
</style>

</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="note-wrap">
      <div class="note">
        <h1>BUCKET LIST</h1>
        <p class="lead">はじめの項目は例です。自由に消したり、自分の言葉で足したりしてください。</p>
      </div>
    </div>
    <div class="status" aria-live="polite">
      <div class="badge"><b id="num"></b><small>達成</small></div>
      <div class="bar-card">
        <div class="bar-meta"><span>達成率</span><span id="pct"></span></div>
        <div class="bar" role="progressbar" aria-label="達成率" aria-valuemin="0" aria-valuemax="100" id="bar"><span id="barfill"></span></div>
      </div>
    </div>
  </header>

  <div class="seg" role="group" aria-label="表示の切り替え">
    <button type="button" data-f="all" aria-pressed="true">すべて</button>
    <button type="button" data-f="todo" aria-pressed="false">これから</button>
    <button type="button" data-f="done" aria-pressed="false">達成済み</button>
  </div>

  <main class="groups" id="groups"></main>

  <form id="addForm" class="join">
    <h2>やりたいことを足す</h2>
    <div class="row">
      <input type="text" id="newText" placeholder="例:友だちと温泉旅行に行く" maxlength="80" autocomplete="off" aria-label="やりたいこと">
      <select id="newCat" aria-label="カテゴリ"></select>
      <button class="add" type="submit">追加</button>
    </div>
  </form>

  <section class="sync" id="syncPanel" hidden>
    <h2>スマホとPCで同期する</h2>
    <p id="syncNote"></p>
    <form class="auth" id="authForm">
      <input type="email" id="authEmail" autocomplete="email" placeholder="メールアドレス" aria-label="メールアドレス">
      <input type="password" id="authPass" autocomplete="current-password" placeholder="パスワード(6文字以上)" aria-label="パスワード">
      <div class="row">
        <button type="submit" class="btn btn-wine">ログイン</button>
        <button type="button" class="btn btn-line" id="signupBtn">新しく登録</button>
      </div>
      <button type="button" class="link" id="resetBtn">パスワードを忘れたとき</button>
    </form>
    <div class="authed" id="authed" hidden>
      <span id="who"></span>
      <button type="button" class="btn btn-line" id="logoutBtn">ログアウト</button>
    </div>
    <p id="syncMsg" role="status"></p>
  </section>

  <footer>
    <span id="status"></span>
    <span>チェックを入れると、その日付が「達成」として残ります。</span>
  </footer>
</div>

<script>
(function () {
  var CATS = [
    { id: "place", name: "行きたい場所" },
    { id: "food", name: "食べたいもの" },
    { id: "challenge", name: "挑戦したいこと" },
    { id: "learn", name: "身につけたいこと" },
    { id: "life", name: "暮らしの中で" }
  ];
  var DEFAULTS = [
    { id: "d01", cat: "place", text: "富士山の山頂で日の出を見る" },
    { id: "d02", cat: "place", text: "屋久島で縄文杉に会いに行く" },
    { id: "d03", cat: "place", text: "オーロラを見に行く" },
    { id: "d04", cat: "place", text: "京都のお寺を一日かけて巡る" },
    { id: "d05", cat: "food", text: "本場のナポリでピザを食べる" },
    { id: "d06", cat: "food", text: "北海道で獲れたてのウニ丼を食べる" },
    { id: "d07", cat: "food", text: "各地の名物ラーメンを食べ比べる" },
    { id: "d08", cat: "challenge", text: "フルマラソンを完走する" },
    { id: "d09", cat: "challenge", text: "ひとりで海外旅行に行く" },
    { id: "d10", cat: "challenge", text: "スカイダイビングに挑戦する" },
    { id: "d11", cat: "learn", text: "英語で日常会話ができるようになる" },
    { id: "d12", cat: "learn", text: "好きな曲を一曲、楽器で弾けるようになる" },
    { id: "d13", cat: "learn", text: "気になっていた資格を一つ取る" },
    { id: "d14", cat: "life", text: "本を100冊読む" },
    { id: "d15", cat: "life", text: "毎朝の散歩を一年続ける" },
    { id: "d16", cat: "life", text: "大切な人に手紙を書く" },
    { id: "d17", cat: "life", text: "お気に入りの写真を一冊のアルバムにまとめる" }
  ];

  var KEY = "yarita-list-v1";
  var state = { done: {}, added: [], removed: [] };
  var filter = "all";

  function norm(d) {
    d = d || {};
    return {
      done: (d.done && typeof d.done === "object") ? d.done : {},
      added: Array.isArray(d.added) ? d.added : [],
      removed: Array.isArray(d.removed) ? d.removed : []
    };
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function hasContent(s) {
    return Object.keys(s.done).length > 0 || s.added.length > 0 || s.removed.length > 0;
  }
  function today() {
    var d = new Date();
    return (d.getMonth() + 1) + "/" + d.getDate();
  }

  /* ---------- 保存 ---------- */
  var statusEl = document.getElementById("status");
  function setStatus(kind) {
    statusEl.textContent = kind === "local" ? "この端末のブラウザに保存しています。" : kind;
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  function sync(op) {
    if (window.__blSync) { try { window.__blSync(op); } catch (e) {} }
  }
  window.__bl = {
    get: function () { return state; },
    hasContent: function () { return hasContent(state); },
    set: function (s) { state = norm(s); persist(); render(); },
    setStatus: setStatus
  };

  /* ---------- 表示 ---------- */
  function allItems() {
    var gone = {};
    state.removed.forEach(function (id) { gone[id] = true; });
    return DEFAULTS.filter(function (it) { return !gone[it.id]; }).concat(state.added);
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function render() {
    var items = allItems();
    var total = items.length;
    var doneCount = items.filter(function (it) { return state.done[it.id]; }).length;
    var pct = total ? Math.round(doneCount / total * 100) : 0;

    document.getElementById("num").textContent = doneCount + "/" + total;
    document.getElementById("pct").textContent = pct + "%";
    document.getElementById("barfill").style.width = pct + "%";
    document.getElementById("bar").setAttribute("aria-valuenow", String(pct));

    var root = document.getElementById("groups");
    root.textContent = "";
    var shown = 0;
    var gi = 0;

    CATS.forEach(function (c) {
      var all = items.filter(function (it) { return it.cat === c.id; });
      var list = all.filter(function (it) {
        var d = !!state.done[it.id];
        return filter === "all" || (filter === "done" ? d : !d);
      });
      if (!list.length) return;
      shown += list.length;

      var g = el("section", "group" + (gi % 2 ? " alt" : ""));
      gi++;
      var head = el("div", "group-head");
      head.appendChild(el("h2", null, c.name));
      var dc = all.filter(function (it) { return state.done[it.id]; }).length;
      head.appendChild(el("span", "count", dc + " / " + all.length));
      g.appendChild(head);

      var ul = el("ul");
      list.forEach(function (it) {
        var d = state.done[it.id];
        var li = el("li", d ? "done" : "");
        var label = el("label");
        var cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = !!d;
        cb.id = "cb-" + it.id;
        cb.addEventListener("change", function () { toggle(it.id); });
        label.appendChild(cb);
        label.appendChild(el("span", "txt", it.text));
        if (d) label.appendChild(el("span", "when", typeof d === "string" ? d + " 達成" : "達成"));
        li.appendChild(label);

        var del = el("button", "del", "×");
        del.type = "button";
        del.setAttribute("aria-label", "「" + it.text + "」をリストから消す");
        del.addEventListener("click", function () { remove(it.id); });
        li.appendChild(del);
        ul.appendChild(li);
      });
      g.appendChild(ul);
      root.appendChild(g);
    });

    if (!shown) {
      var msg = total === 0
        ? "リストは空です。下のフォームから、やりたいことを足してください。"
        : filter === "done"
          ? "まだ達成した項目はありません。最初の一つにチェックを入れてみましょう。"
          : "すべて達成しました。次にやりたいことを足してみてください。";
      root.appendChild(el("div", "empty", msg));
    }
  }

  /* ---------- 操作 ---------- */
  function toggle(id) {
    if (state.done[id]) delete state.done[id];
    else state.done[id] = today();
    persist();
    sync({ t: "done", id: id, v: state.done[id] || null });
    render();
  }
  function remove(id) {
    delete state.done[id];
    var idx = -1;
    state.added.forEach(function (it, i) { if (it.id === id) idx = i; });
    if (idx >= 0) state.added.splice(idx, 1);
    else if (state.removed.indexOf(id) < 0) state.removed.push(id);
    persist();
    sync({ t: "remove", id: id, added: idx >= 0 });
    render();
  }

  var sel = document.getElementById("newCat");
  CATS.forEach(function (c) {
    var o = document.createElement("option");
    o.value = c.id; o.textContent = c.name;
    sel.appendChild(o);
  });
  document.getElementById("addForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var input = document.getElementById("newText");
    var text = input.value.trim();
    if (!text) { input.focus(); return; }
    var item = { id: "u" + Date.now().toString(36), cat: sel.value, text: text, t: Date.now() };
    state.added.push(item);
    input.value = "";
    persist();
    sync({ t: "add", item: item });
    render();
  });

  Array.prototype.forEach.call(document.querySelectorAll(".seg button"), function (b) {
    b.addEventListener("click", function () {
      filter = b.getAttribute("data-f");
      Array.prototype.forEach.call(document.querySelectorAll(".seg button"), function (x) {
        x.setAttribute("aria-pressed", x === b ? "true" : "false");
      });
      render();
    });
  });

  /* ---------- 起動 ---------- */
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) state = norm(JSON.parse(raw));
  } catch (e) {}
  setStatus("local");
  render();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
<script type="module">
(async function () {
  var $ = function (id) { return document.getElementById(id); };
  var cfg = null;
  try { cfg = (await import("./firebase-config.js")).default; } catch (e) { return; }
  if (!cfg || !cfg.apiKey || !cfg.projectId) return;

  var panel = $("syncPanel"), note = $("syncNote"), msg = $("syncMsg");
  var form = $("authForm"), authed = $("authed"), who = $("who");
  var email = $("authEmail"), pass = $("authPass");
  panel.hidden = false;
  function say(t) { msg.textContent = t || ""; }

  var B = "https://www.gstatic.com/firebasejs/10.14.1/";
  var A, Au, F;
  try {
    var mods = await Promise.all([
      import(B + "firebase-app.js"),
      import(B + "firebase-auth.js"),
      import(B + "firebase-firestore.js")
    ]);
    A = mods[0]; Au = mods[1]; F = mods[2];
  } catch (e) {
    note.textContent = "同期の部品を読み込めませんでした。ネットにつないで開き直してください。";
    return;
  }

  var app = A.initializeApp(cfg);
  var auth = Au.getAuth(app);
  var db;
  try {
    db = F.initializeFirestore(app, {
      localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() })
    });
  } catch (e) { db = F.getFirestore(app); }

  var ERR = {
    "auth/invalid-email": "メールアドレスの形式が正しくありません。",
    "auth/invalid-credential": "メールアドレスかパスワードが違います。",
    "auth/wrong-password": "メールアドレスかパスワードが違います。",
    "auth/user-not-found": "メールアドレスかパスワードが違います。",
    "auth/email-already-in-use": "このメールアドレスは登録済みです。「ログイン」を押してください。",
    "auth/weak-password": "パスワードは6文字以上にしてください。",
    "auth/missing-password": "パスワードを入れてください。",
    "auth/network-request-failed": "ネットにつながっていません。つないでからもう一度試してください。",
    "auth/too-many-requests": "試行が多すぎます。少し待ってからやり直してください。"
  };
  function errText(e) { return ERR[(e && e.code) || ""] || "うまくいきませんでした。もう一度試してください。"; }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    say("");
    Au.signInWithEmailAndPassword(auth, email.value.trim(), pass.value)
      .then(function () { pass.value = ""; })
      .catch(function (err) { say(errText(err)); });
  });
  $("signupBtn").addEventListener("click", function () {
    say("");
    Au.createUserWithEmailAndPassword(auth, email.value.trim(), pass.value)
      .then(function () { pass.value = ""; })
      .catch(function (err) { say(errText(err)); });
  });
  $("resetBtn").addEventListener("click", function () {
    if (!email.value.trim()) { say("メールアドレスを入れてから押してください。"); return; }
    Au.sendPasswordResetEmail(auth, email.value.trim())
      .then(function () { say("再設定のメールを送りました。"); })
      .catch(function (err) { say(errText(err)); });
  });
  $("logoutBtn").addEventListener("click", function () { Au.signOut(auth); });

  var unsub = null, ref = null, decided = false;

  window.__blSync = function (op) {
    if (!ref) return;
    var D = F.deleteField, data = {};
    if (op.t === "done") {
      data.done = {}; data.done[op.id] = op.v ? op.v : D();
    } else if (op.t === "add") {
      data.added = {}; data.added[op.item.id] = op.item;
    } else if (op.t === "remove") {
      data.done = {}; data.done[op.id] = D();
      if (op.added) { data.added = {}; data.added[op.id] = D(); }
      else { data.removed = {}; data.removed[op.id] = true; }
    } else { return; }
    F.setDoc(ref, data, { merge: true }).catch(function () {});
  };

  function pushAll() {
    var s = window.__bl.get();
    var data = { done: s.done, added: {}, removed: {} };
    s.added.forEach(function (it) { data.added[it.id] = it; });
    s.removed.forEach(function (id) { data.removed[id] = true; });
    F.setDoc(ref, data, { merge: true }).catch(function () {});
  }

  Au.onAuthStateChanged(auth, function (user) {
    if (unsub) { unsub(); unsub = null; }
    ref = null; decided = false;
    say("");
    if (!user) {
      form.hidden = false; authed.hidden = true;
      note.textContent = "ログインすると、スマホとPCで同じリストを使えます。ネットがない場所でも使えて、つながると自動で同期します。";
      window.__bl.setStatus("local");
      return;
    }
    form.hidden = true; authed.hidden = false;
    who.textContent = user.email + " でログイン中";
    note.textContent = "";
    ref = F.doc(db, "lists", user.uid);
    unsub = F.onSnapshot(ref, function (snap) {
      if (snap.exists()) {
        var d = snap.data() || {};
        var added = Object.keys(d.added || {})
          .map(function (k) { return d.added[k]; })
          .filter(function (x) { return x && x.id && x.text; })
          .sort(function (x, y) { return (x.t || 0) - (y.t || 0); });
        window.__bl.set({ done: d.done || {}, added: added, removed: Object.keys(d.removed || {}) });
        decided = true;
      } else if (!snap.metadata.fromCache && !decided) {
        decided = true;
        if (window.__bl.hasContent()) pushAll();
      }
      window.__bl.setStatus(
        snap.metadata.hasPendingWrites ? "同期待ちです。ネットにつながると自動で送ります。"
        : snap.metadata.fromCache ? "オフラインで表示中です。つながると最新になります。"
        : "同期済みです。"
      );
    }, function () {
      window.__bl.setStatus("同期できませんでした。Firebaseのルールの設定を確認してください。");
    });
  });
})();
</script>
</body>
